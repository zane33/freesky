services:
  freesky:
    # Build from local repository Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 3000
        API_URL: http://192.168.3.148:3000
        BACKEND_PORT: 8005
    
    # Replace with actual container ID/name or comment out for default networking
    network_mode: host
    
    # Ports are not needed when using container networking
    # Comment out if using container networking
    #ports:
    #  - "3000:3000"
    #  - "${BACKEND_PORT:-8005}:${BACKEND_PORT:-8005}"
    #  - "2019:2019"  # Expose Caddy admin port for debugging
    
    environment:
      # Application Configuration
      - PORT=3000
      - BACKEND_PORT=${BACKEND_PORT:-8005}
      - HOST_IP=${HOST_IP:-0.0.0.0}  # Dynamic host IP, will use 0.0.0.0 if not set
      - DOCKER_HOST_IP=192.168.3.148  # External hostname/IP for client-facing URLs
      - BACKEND_URI=${BACKEND_URI:-}  # Let rxconfig determine this dynamically
      - API_URL=http://192.168.3.148:3000  # Explicitly set for correct WebSocket connection
      
      # External Services
      - DADDYLIVE_URI=${DADDYLIVE_URI:-https://dlhd.st}
      
      # Application Settings
      - CHANNEL_PREFS_FILE=/app/data/channel_prefs.json  # Persisted via the ./data volume below
      - USERS_FILE=/app/data/users.json
      - APP_SETTINGS_FILE=/app/data/app_settings.json
      - VIRTUAL_CHANNELS_FILE=/app/data/virtual_channels.json
      # Virtual channels: a web page restreamed as live HLS. HLS segments go to
      # the tmpfs mounted below - they are write-heavy, live for seconds, and are
      # never worth touching disk.
      - VIRTUAL_HLS_ROOT=/streams
      # Browser profiles live on the ./data volume, NOT in the container's
      # filesystem: they hold the cookies and stored logins that let a channel
      # come back after a restart already signed in instead of at a login page.
      - VIRTUAL_PROFILE_ROOT=/app/data/virtual-profiles
      # 0 = no limit on concurrent browser sessions, which is the default:
      # running several virtual channels side by side is the point of the
      # feature. Each session costs roughly 1.5-2 CPU cores and ~900MB at
      # 720p30 (about double at 1080p30), so the real ceiling is the host and
      # the memory limit below - set a positive number here only if you want a
      # hard cap that evicts the least recently watched session.
      - MAX_VIRTUAL_SESSIONS=${MAX_VIRTUAL_SESSIONS:-0}
      # Admin control-panel preview. It captures the SAME X display the encoder
      # does, so the panel shows exactly what viewers see - browser dialogs
      # included. Only size and frame rate are reduced. It is a second capture
      # alongside the encoder, so lower the width first if the panel feels slow.
      # Thread caps. These stop x264 and Chromium's rasteriser fighting over a
      # small container's cores. The encode is cheap (a fraction of a core at
      # 720p30); the browser is not, and the usual failure is Chromium being
      # starved until it stops painting - which shows up in the ffmpeg log as
      # "More than 1000 frames duplicated". Raise both if you give the container
      # more CPUs.
      - VIRTUAL_ENCODER_THREADS=${VIRTUAL_ENCODER_THREADS:-2}
      - VIRTUAL_RASTER_THREADS=${VIRTUAL_RASTER_THREADS:-2}
      # Tab capture (the default capture path, see VIRTUAL_CHANNELS.md): the
      # browser records its own tab as H.264 and delivers it to the backend
      # over loopback. This is where it delivers to; only change it if the
      # backend listens somewhere other than 127.0.0.1:BACKEND_PORT.
      - VIRTUAL_CAPTURE_WS=${VIRTUAL_CAPTURE_WS:-}
      - VIRTUAL_CONTROL_FPS=${VIRTUAL_CONTROL_FPS:-10}
      - VIRTUAL_CONTROL_MAX_WIDTH=${VIRTUAL_CONTROL_MAX_WIDTH:-960}
      # ffmpeg mjpeg quality: 2 best, 31 worst.
      - VIRTUAL_CONTROL_QUALITY=${VIRTUAL_CONTROL_QUALITY:-7}
      # Seed for the trusted-subnet allowlist on a fresh install; once saved in
      # Settings the stored value wins. Clients here skip login entirely.
      - TRUSTED_NETWORKS=${TRUSTED_NETWORKS:-}
      # First-run bootstrap only — ignored once a user exists, so changing the
      # admin password in the UI is not undone on restart. CHANGE THESE.
      - ADMIN_USER=${ADMIN_USER:-admin}
      # Leave ADMIN_PASS unset to have a random one generated and printed to the
      # container log on first boot. No weak default ships.
      - ADMIN_PASS=${ADMIN_PASS:-}
      # HTTPS. Default is plain HTTP. ENABLE_HTTPS=true ADDS a TLS listener on
      # HTTPS_PORT while PORT keeps serving plain HTTP — one port cannot do both,
      # and taking HTTP away broke every existing playlist URL. start.sh generates
      # a self-signed cert into ./data/certs, or uses your own cert.pem/key.pem.
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
      - HTTPS_PORT=${HTTPS_PORT:-3443}
      # Extra names/IPs to put in the self-signed cert (comma separated).
      # DOCKER_HOST_IP is included automatically. A client connecting by IP only
      # matches IP entries, so the address you actually browse to must be here.
      - TLS_HOSTS=${TLS_HOSTS:-media.authorisedit.co.nz}
      # Advanced overrides, normally left empty — start.sh fills them in. Compose
      # uses ${VAR:-default}, NOT Caddy's ${VAR:default} form; mixing the two here
      # is what produced "invalid interpolation format".
      - SITE_ADDRESS=${SITE_ADDRESS:-}
      - CADDY_TLS=${CADDY_TLS:-}
      # Keeps Caddy's generated CA and any issued certs on the data volume, so a
      # restart doesn't mint a new self-signed CA (or re-hit Let's Encrypt limits).
      - XDG_DATA_HOME=/app/data
      - PROXY_CONTENT=${PROXY_CONTENT:-TRUE}
      - SOCKS5=${SOCKS5:-}
      # One async worker. start.sh exports this as GRANIAN_WORKERS, which is the
      # only name reflex actually reads -- setting WORKERS alone did nothing, and
      # reflex then defaulted to `(cpu_count * 2) + 1` workers because it could
      # ping the Redis that start.sh launches.
      #
      # Keep this at 1. Multiple granian workers each hold a DIFFERENT in-memory
      # encryption key (utils.py key_bytes = os.urandom at import), so a content
      # URL minted by one worker fails to decrypt on another. Worse, each worker
      # gets its own virtual_session.manager and its own autostart task, so every
      # worker raced to start the same virtual channel on the same X display and
      # the same Chrome profile -- which killed workers and surfaced as
      # intermittent 502s from the control panel.
      - WORKERS=${WORKERS:-1}
      - MAX_CONCURRENT_STREAMS=${MAX_CONCURRENT_STREAMS:-5}  # Reduced from 10 to 5
      
      # Reflex Framework Settings
      - REFLEX_ENV=prod
      - REFLEX_SKIP_COMPILE=1
      
      # Proxy Configuration
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1
    
    # Channel enable/disable choices must outlive the container. So must the logo
    # cache — without it every restart re-fetches ~900 logos from upstream.
    volumes:
      - ./data:/app/data
      - ./data/logo-cache:/app/logo-cache

    # HLS output for virtual channels. About 12MB per session is live at any
    # moment (~2s x 10 segments x 4.5Mbps), so 1G covers dozens of concurrent
    # channels. It is a tmpfs cap, not an allocation - unused space costs
    # nothing.
    tmpfs:
      - /streams:size=1g

    # Chromium uses /dev/shm to share render surfaces between its processes.
    # Docker's 64MB default makes it crash with blank pages and "page crash"
    # errors. The --disable-dev-shm-usage flag is also set (virtual_session.py),
    # but that only makes it fall back to /tmp - raising this is the real fix.
    shm_size: "1gb"

    # CPU: pin cores rather than metering them.
    #
    # `cpus:` (below, CPU_LIMIT) is a CFS *quota*: the container may use N
    # core-seconds per second, enforced by pausing EVERY thread in it once the
    # quota for the current 100ms period is spent. Chromium runs dozens of
    # threads, so on a host with more cores than the quota it can burn a
    # 4-core allowance in 40ms and then sit frozen for the remaining 60ms --
    # ten times a second. That is invisible in average CPU and shows up as a
    # stuttering virtual channel. Settings -> Virtual Channels -> Sessions
    # reports it as "throttled N% of periods".
    #
    # A cpuset gives the container N whole cores and never pauses it. Set
    # CPUSET to a core list (e.g. "0-3") to use that instead; an empty value
    # leaves it unset. When CPUSET is set, raise CPU_LIMIT to at least the
    # number of pinned cores (or the quota still applies on top).
    cpuset: "${CPUSET:-}"

    # Resource Limits
    #
    # The CPU limit lives under deploy.resources.limits, NOT as a top-level
    # `cpus:`. Compose treats the two as the same setting and refuses the file
    # outright ("can't set distinct values on 'cpus' and
    # 'deploy.resources.limits.cpus'") when both appear, so they cannot be
    # combined even with matching values.
    deploy:
      resources:
        limits:
          # Virtual channels are CPU-bound on software rendering, and the
          # failure mode is the browser being starved until it stops painting.
          # Budget at least 2 CPUs per concurrent 720p channel with tab
          # capture (the browser also encodes); the ffmpeg remux is free.
          # Prefer CPUSET above for the reason given there.
          cpus: "${CPU_LIMIT:-4}"
          # 512M was right when this was a pure HTTP proxy. A virtual channel
          # adds a headful Chromium (~500-700M) plus an ffmpeg x264 encoder
          # (~150M) per session. Concurrent sessions are uncapped by default, so
          # THIS is the limit that actually decides how many you can run: budget
          # ~1G base + ~900M per concurrent 720p30 session and raise it to suit.
          # Too low and the container is OOM-killed mid-stream, taking every
          # channel down, not just the newest one.
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          memory: 512M
    
    # Restart Policy
    restart: unless-stopped
    
    # Health Check
    healthcheck:
      # CMD-SHELL, not CMD: exec form has no shell, so "||" and "exit" were passed
      # to curl as extra URLs and the check failed even when the app was healthy.
      # Probes the backend directly on plain HTTP. Hitting Caddy's port would fail
      # the moment TLS is enabled, marking a perfectly healthy container unhealthy.
      test: ["CMD-SHELL", "curl -f http://localhost:${BACKEND_PORT:-8005}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
